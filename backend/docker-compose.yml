services:
  trading:
    build: .
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      # Docker health is liveness.  /ready intentionally depends on the
      # separately-running pipeline and must not gate nginx startup.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
  pipeline:
    build: .
    command: ["python","-m","app.worker"]
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      trading:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      start_period: 120s
      interval: 60s
      timeout: 10s
      retries: 3
  reconciler:
    build: .
    command: ["python","-m","app.reconciliation"]
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      trading:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "app.reconciliation", "--healthcheck"]
      start_period: 120s
      interval: 60s
      timeout: 10s
      retries: 3
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    environment:
      VESPER_DOMAIN: ${VESPER_DOMAIN:-vesper-scar.duckdns.org}
    restart: unless-stopped
    depends_on:
      trading:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://localhost/health || wget -q -O /dev/null http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  certbot:
    build:
      context: ..
      dockerfile: deploy/certbot/Dockerfile
    environment:
      VESPER_DOMAIN: ${VESPER_DOMAIN:-vesper-scar.duckdns.org}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
volumes:
  certbot-webroot:
  letsencrypt:
