name: Vesper CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vesper
          POSTGRES_PASSWORD: vesper
          POSTGRES_DB: vesper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vesper -d vesper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import os; print('database configured:', bool(os.environ.get('DATABASE_URL')))"
        env:
          DATABASE_URL: postgresql://vesper:vesper@localhost:5432/vesper_test
      - run: python -m compileall -q app tests
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://vesper:vesper@localhost:5432/vesper_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
